trigger:
  branches:
    include:
      - '*'

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true

  - script: |
      git remote add github https://$(GITHUB_PAT)@github.com/worldbank/FuzzyAI.git
      git fetch --all
      git push github refs/heads/main:refs/heads/main
    displayName: 'Push to worldbank/FuzzyAI'
    env:
      GITHUB_PAT: $(GITHUB_PAT)
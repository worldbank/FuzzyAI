trigger:
  branches:
    include:
      - '*'

pool:
  vmImage: ubuntu-latest

variables:
  - group: Github

steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true

  - script: |
      git remote add github https://$(GITHUB_PAT)@github.com/worldbank/FuzzyAI.git
      git push github refs/heads/master:refs/heads/master
    displayName: 'Push to worldbank/FuzzyAI'
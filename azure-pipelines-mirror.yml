trigger:
  branches:
    include:
      - '*'   # mirrors all branches

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0          # full history, not shallow
    persistCredentials: true

  - script: |
      git remote add github https://$(GITHUB_PAT)@github.com/worldbank/FuzzyAI.git
      git fetch --all
      git push github --mirror
    displayName: 'Mirror to worldbank/FuzzyAI'
    env:
      GITHUB_PAT: $(GITHUB_PAT)
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deduplix"
version = "0.1.0"
description = "Entity deduplication and matching library with LLM validation"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "World Bank", email = "portfoliointelligence@worldbankgroup.org" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "pandas>=1.3.0",
  "numpy>=1.20.0",
  "rapidfuzz>=2.0.0",
  "networkx>=2.6.0",
  "tqdm>=4.60.0",
  "click>=8.0.0",
  "pyyaml>=5.4.0",
  "pydantic>=1.10.0",
]

[project.optional-dependencies]
llm = ["openai>=0.27.0"]
spark = ["pyspark>=3.0.0"]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=3.0.0",
  "black>=22.0.0",
  "flake8>=4.0.0",
  "mypy>=0.900",
]

[project.urls]
Homepage = "https://github.com/worldbank/fuzzy-ai"
Repository = "https://github.com/worldbank/fuzzy-ai"

[project.scripts]
deduplix = "deduplix.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra -q --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "performance: marks tests as performance benchmarks",
]

[tool.coverage.run]
source = ["deduplix"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
